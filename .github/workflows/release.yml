name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v1.1.5

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Validate tag and build package
        id: package
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./manifest.json").version')"
          test "$RELEASE_TAG" = "v$version"
          npm run package
          zip_path="dist/youtube-digest-vocabulary-$RELEASE_TAG.zip"
          checksum="$(sha256sum "$zip_path" | awk '{print $1}')"
          printf 'zip_path=%s\n' "$zip_path" >> "$GITHUB_OUTPUT"
          printf 'checksum=%s\n' "$checksum" >> "$GITHUB_OUTPUT"
          printf '%s  %s\n' "$checksum" "$(basename "$zip_path")" > dist/SHA256SUMS.txt

      - name: Write release notes
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          PACKAGE_SHA256: ${{ steps.package.outputs.checksum }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          YouTube Digest Vocabulary 把 YouTube 视频转成可核验、可复习的学习资料。

          ## 原项目与二次创作说明

          本版本是基于 [zarazhangrui/youtube-digest](https://github.com/zarazhangrui/youtube-digest) 的二次创作。该仓库是本项目的原创来源。

          感谢 Zara Zhang 及原项目贡献者创建、公开并持续维护这一基础项目。本仓库由二创维护者独立维护，并非原项目的官方仓库。原项目的 MIT 版权与许可声明保留在安装包的 LICENSE 中，完整中英文署名见 [NOTICE.md](https://github.com/yezg9920-kely/youtube-digest-vocabulary/blob/main/NOTICE.md)。

          ## 本次版本亮点

          - Overview 默认展示一句话结论、重点结论与章节，并可回到本地逐字稿证据。
          - Deep Analysis 改为显式触发，避免切换标签时意外产生 AI 费用。
          - 支持字幕、双语翻译、笔记、生词卡以及 Markdown、CSV、Anki TSV 导出。
          - 缓存与 AI 结果按视频字幕指纹隔离，避免跨视频污染和重复付费。

          ## 安装

          下载 ZIP 并解压，在 Chrome 打开 chrome://extensions，启用开发者模式，点击“加载已解压的扩展程序”，选择直接包含 manifest.json 的目录。

          ## 校验值

          SHA-256: \`$PACKAGE_SHA256\`
          EOF

      - name: Publish or refresh GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          ZIP_PATH: ${{ steps.package.outputs.zip_path }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "$ZIP_PATH" \
              dist/SHA256SUMS.txt \
              --clobber
            gh release edit "$RELEASE_TAG" \
              --title "YouTube Digest Vocabulary $RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$RELEASE_TAG" \
              "$ZIP_PATH" \
              dist/SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "YouTube Digest Vocabulary $RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
