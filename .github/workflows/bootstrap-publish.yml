name: Publish source bootstrap

on:
  push:
    branches: [main]
    paths:
      - source-part-b.b64

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand verified source snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat source-part-a.b64 source-part-b.b64 > "$RUNNER_TEMP/source.tar.gz.b64"
          base64 --decode "$RUNNER_TEMP/source.tar.gz.b64" > "$RUNNER_TEMP/source.tar.gz"
          tar -xzf "$RUNNER_TEMP/source.tar.gz"
          rm source-part-a.b64 source-part-b.b64
          rm .github/workflows/bootstrap-publish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish YouTube Digest Vocabulary"
          git push origin HEAD:main
